name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  locked:
    name: tests (locked deps, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest tests/ -x --tb=short

  latest-deps:
    # What `uvx mudm-mcp` gives a new user: the newest release of every dependency, not the lockfile.
    name: tests (latest dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --upgrade
      - run: uv run pytest tests/ -x --tb=short
      - run: uv run pytest -m live --tb=short
